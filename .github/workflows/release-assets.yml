name: Release SDK Assets

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag_name:
        description: Git tag to upload assets to (for example, v1.0.0)
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag_name }}

jobs:
  build-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Derive version
        run: |
          echo "VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build Python asset
        working-directory: python
        run: |
          pip install build
          python -m build
          cp dist/struxel_sdk-${VERSION}.tar.gz ../struxel-sdk-python-${VERSION}.tar.gz || cp dist/struxel-sdk-${VERSION}.tar.gz ../struxel-sdk-python-${VERSION}.tar.gz

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build TypeScript asset
        working-directory: typescript
        run: |
          npm ci
          npm pack
          cp struxel-sdk-${VERSION}.tgz ../struxel-sdk-typescript-${VERSION}.tgz

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build Java asset
        working-directory: java
        run: |
          mvn -B -DskipTests package
          cp target/sdk-${VERSION}.jar ../struxel-sdk-java-${VERSION}.jar

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build Go asset
        run: |
          tar -C "${GITHUB_WORKSPACE}" -czf "${GITHUB_WORKSPACE}/struxel-sdk-go-${VERSION}.tar.gz" go

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            struxel-sdk-python-${{ env.VERSION }}.tar.gz
            struxel-sdk-typescript-${{ env.VERSION }}.tgz
            struxel-sdk-java-${{ env.VERSION }}.jar
            struxel-sdk-go-${{ env.VERSION }}.tar.gz
